<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Prometheus + Grafana: scrape, visualize, alert</title>
  <desc id="d">Your apps expose a /metrics endpoint; Prometheus scrapes them on a schedule; Grafana charts the data and Alertmanager fires alerts when a threshold is crossed. A monitoring tutorial with a ready-to-run stack.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#e6522c"/><stop offset=".5" stop-color="#ff9f1c"/><stop offset="1" stop-color="#f46800"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes scrape { 0% { offset-distance:0%; opacity:0 } 10% {opacity:1} 45% { offset-distance:100%; opacity:1 } 55%,100% {opacity:0} } .scrape { animation: scrape 2.5s infinite; offset-path: path('M250 200 L 360 200'); }
    @keyframes scrape2 { 0% { offset-distance:0%; opacity:0 } 10% {opacity:1} 45% { offset-distance:100%; opacity:1 } 55%,100% {opacity:0} } .scrape2 { animation: scrape2 2.5s .4s infinite; offset-path: path('M490 200 L 600 200'); }
    @keyframes draw { 0% { stroke-dashoffset:320 } 60%,100% { stroke-dashoffset:0 } } .draw { stroke-dasharray:320; animation: draw 8.0s infinite; }
    @keyframes alert { 0%,62.50% { opacity:0 } 66.88%,92.50% { opacity:1 } 96.25%,100% { opacity:0 } } .alert { animation:alert 8.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .draw { stroke-dashoffset:0 } }
  </style>
  <rect width="960" height="400" rx="20" fill="#0f1420"/>
  <text x="40" y="56" font-size="32" font-weight="800" style="fill:url(#title)">Prometheus + Grafana</text>
  <text x="42" y="84" font-size="16" class="muted">Scrape metrics, chart them, and get alerted — a ready-to-run monitoring stack.</text>

  <rect x="40" y="150" width="210" height="110" rx="10" fill="#161d2b" stroke="#2c3750"/>
  <text x="56" y="174" font-size="11" font-weight="700" class="muted">YOUR APPS</text>
  <text x="56" y="200" font-size="11.5" class="mono muted">node-app   /metrics</text>
  <text x="56" y="222" font-size="11.5" class="mono muted">python-app /metrics</text>
  <text x="56" y="244" font-size="11.5" class="mono muted">node exporters…</text>

  <circle cx="420" cy="200" r="48" fill="#2a1710" stroke="#e6522c" stroke-width="2"/>
  <text x="420" y="196" text-anchor="middle" font-size="12" font-weight="800">Prometheus</text>
  <text x="420" y="214" text-anchor="middle" font-size="9.5" class="muted">scrapes + stores</text>
  <line x1="250" y1="200" x2="360" y2="200" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <circle class="scrape" r="5" fill="#e6522c"/>
  <text x="305" y="190" text-anchor="middle" font-size="9" class="mono muted">scrape</text>

  <rect x="600" y="150" width="320" height="140" rx="10" fill="#0b0f18" stroke="#f46800" stroke-opacity=".5"/>
  <text x="616" y="172" font-size="12" font-weight="700" style="fill:#ffb27a">Grafana</text>
  <text x="904" y="172" text-anchor="end" font-size="10" class="muted">system-overview</text>
  <line x1="616" y1="278" x2="904" y2="278" stroke="#1d2636"/>
  <polyline class="draw" points="620,252 648,242 676,238 704,242 732,251 760,261 788,266 816,263 844,254 872,210 900,238" fill="none" stroke="#ff9f1c" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="490" y1="200" x2="600" y2="200" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <circle class="scrape2" r="5" fill="#f46800"/>

  <g class="alert"><rect x="600" y="302" width="320" height="38" rx="10" fill="#2d1113" stroke="#ff5c6e"/><text x="616" y="326" font-size="12" font-weight="700" style="fill:#ff9ba3">🔔 Alertmanager · HighCPU firing</text></g>
  <text x="40" y="322" font-size="12" class="muted">One <tspan class="mono">docker compose up</tspan> brings up Prometheus, Grafana</text>
  <text x="40" y="342" font-size="12" class="muted">and Alertmanager, with the datasource and a dashboard provisioned.</text>
</svg>
